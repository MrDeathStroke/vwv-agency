<?xml version="1.0" encoding="UTF-8"?>
<!--
  VWV Favicon — optimized for 16/32px tab-bar render.
  Slightly chunkier strokes than the master so the lines hold at small
  sizes. Cobalt #2563EB stroke.
-->
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VWV">
  <defs>
    <clipPath id="fav-mask">
      <path d="M 14 16 L 50 82 L 86 16 Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#fav-mask)" stroke="#2563EB" stroke-linecap="square">
    <line x1="0" y1="30" x2="100" y2="30" stroke-width="3"/>
    <line x1="0" y1="44" x2="100" y2="44" stroke-width="4"/>
    <line x1="0" y1="58" x2="100" y2="58" stroke-width="5"/>
    <line x1="0" y1="72" x2="100" y2="72" stroke-width="6"/>
  </g>
</svg>
